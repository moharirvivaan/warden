name: Warden checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor:
    name: Editor boundaries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test editor process, navigation, and approval boundaries
        run: node --test editor/test/*.test.cjs
      - name: Test strict-gate behavior without SDK dependencies
        run: python3 -m unittest discover -s tests -p test_runner.py -v

  sdk-contracts:
    # Deliberately scoped: this job does not prepare historical mods, run the
    # interactive extension host, launch GD, or establish Windows support.
    name: Native SDK 5.11.1 contracts (macOS ARM64)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install native build dependencies
        run: brew install llvm@21 cmake ninja
      - name: Prepare the pinned real SDK example
        run: python3 scripts/prepare-example.py
      - name: Build the analyzer
        shell: bash
        run: |
          WARDEN_LLVM_PREFIX="$(brew --prefix llvm@21)"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$WARDEN_LLVM_PREFIX/bin/clang++" \
            -DCMAKE_C_COMPILER="$WARDEN_LLVM_PREFIX/bin/clang" \
            -DLLVM_DIR="$WARDEN_LLVM_PREFIX/lib/cmake/llvm" \
            -DClang_DIR="$WARDEN_LLVM_PREFIX/lib/cmake/clang"
          cmake --build build
      - name: Run SDK-backed rule contracts without permitting skips
        env:
          PYTHONPATH: tests
        run: |
          python3 - <<'PY'
          import sys
          import unittest
          from run import run_suite
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              'test_analyzer.AnalyzerTests',
              'test_ownership.OwnershipTests',
              'test_array_bounds.ArrayBoundsTests',
          ])
          summary = run_suite(suite, strict=True)
          print('SDK contract gate:', summary['status'])
          sys.exit(0 if summary['status'] == 'passed' else 1)
          PY
